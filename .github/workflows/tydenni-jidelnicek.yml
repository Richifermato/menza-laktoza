name: Týdenní jídelníček

on:
  schedule:
    # GitHub plánuje v UTC. 13:00 v Praze je v létě 11:00 UTC a v zimě 12:00 UTC,
    # proto běží v obou časech a krok "Kontrola času" pustí dál jen ten správný.
    - cron: "0 11 * * 0"
    - cron: "0 12 * * 0"
  workflow_dispatch: # ruční spuštění tlačítkem "Run workflow"

permissions:
  contents: write

jobs:
  jidelnicek:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola času
        if: github.event_name == 'schedule'
        run: |
          # GitHub cron občas běží se zpožděním, proto stačí, že je v Praze 13. hodina.
          [ "$(TZ=Europe/Prague date +%H)" = "13" ] || { echo "V Praze není 13 h, přeskakuji."; echo "SKIP=1" >> "$GITHUB_ENV"; }

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Stáhnout a ohodnotit jídelníček
        if: env.SKIP != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python menza.py

      - name: Uložit stránku
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Jídelníček $(TZ=Europe/Prague date +%-d.%-m.%Y)" || echo "Beze změn"
          git push
